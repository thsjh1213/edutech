<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>리딩챌린지 도전</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #2b2b2b;
    background-image:
      repeating-linear-gradient(135deg, #f5a623 0 40px, #2b2b2b 40px 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 960px;
    background: #1e1e1e;
    border: 6px solid #f5a623;
    border-radius: 18px;
    padding: 22px 28px 20px;
    color: #fff;
    position: relative;
  }

  .mainTitle {
    font-size: 40px;
    font-weight: 800;
    text-align: center;
    color: #f5a623;
    margin: 20px 0 36px;
  }
  .categoryRow {
    display: flex;
    gap: 20px;
    margin-bottom: 8px;
  }
  .categoryBtn {
    flex: 1;
    background: #111;
    border: 3px solid var(--accent);
    border-radius: 16px;
    padding: 36px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .categoryBtn:hover { background: #1a1a1a; }
  .categoryBtn:active { transform: scale(0.97); }
  .categoryBtn .icon {
    font-size: 46px;
  }
  .categoryBtn .label {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
  }
  #catTraffic { --accent: #f5a623; }
  #catFriend { --accent: #e2735e; }
  #catSocial { --accent: #5c8fd6; }
  #catTree { --accent: #4fae5f; }
  #treeMenuScreen {
    display: none;
  }
  #treeMenuScreen .treeSubBtn {
    --accent: #4fae5f;
    flex-direction: row;
    justify-content: flex-start;
    padding: 18px 20px;
    margin-bottom: 14px;
    gap: 16px;
  }
  #treeMenuScreen .treeSubBtn .icon { font-size: 32px; }
  #treeMenuScreen .treeSubBtn .label { font-size: 20px; }
  #treeMenuHomeBtn {
    background: #2b2b2b;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .sign {
    width: 34px;
    height: 34px;
    background: #f5a623;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .title {
    font-size: 17px;
    font-weight: 700;
    color: #f5a623;
    letter-spacing: 0.5px;
    flex: 1;
  }
  #homeBtn {
    background: #2b2b2b;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .stage {
    background: #000;
    border-radius: 12px;
    height: 340px;
    position: relative;
    overflow: hidden;
  }
  .highlightBox {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: 100px;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.92);
    border-top: 2px solid #f5a623;
    border-bottom: 2px solid #f5a623;
    z-index: 1;
  }
  .stage {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
  }
  .track {
    position: absolute;
    left: 0;
    width: 100%;
    z-index: 2;
    will-change: transform;
  }
  .line {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    opacity: 0.35;
    line-height: 49px;
    word-break: keep-all;
    overflow-wrap: normal;
    word-spacing: normal;
  }
  .line.active {
    opacity: 1;
    filter: brightness(1.5);
    text-shadow: 0 0 16px rgba(245,166,35,0.5);
  }
  .progress-wrap {
    margin-top: 16px;
    height: 8px;
    background: #3a3a3a;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: #f5a623;
  }
  .durInfo {
    margin-top: 6px;
    font-size: 13px;
    color: #999;
    text-align: center;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
  }
  button.ctl {
    flex: 1;
    padding: 13px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #playBtn { background: #f5a623; color: #1e1e1e; }
  #restartBtn { background: #3a3a3a; color: #fff; }
  .speedRow {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .speedBtn {
    flex: 1;
    padding: 10px 0;
    font-size: 13px;
    background: #2b2b2b;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 8px;
    line-height: 1.5;
    cursor: pointer;
  }
  .speedBtn.active {
    background: #f5a623;
    color: #1e1e1e;
    border-color: #f5a623;
  }
  .caption {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #999;
  }
  .recordZone {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #recordBtn {
    width: 100%;
    background: #f5a623;
    color: #1e1e1e;
    border: none;
    border-radius: 10px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  #recordBtn.recording {
    background: #e2735e;
    color: #fff;
  }
  #growthCheckBtn {
    width: 100%;
    background: #2b2b2b;
    color: #f5a623;
    border: 2px solid #f5a623;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .recordStatus {
    margin-top: 8px;
    text-align: center;
    font-size: 13px;
    color: #999;
    min-height: 18px;
  }

  /* 모달 오버레이 (완독 확인 / 별점) */
  .modalOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.9);
    border-radius: 14px;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }
  .modalOverlay.show {
    display: flex;
  }
  .modalBox {
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .modalQuestion {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 22px;
  }
  .modalBtnRow {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modalBtnRow button {
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  .starRow {
    font-size: 48px;
    letter-spacing: 8px;
    margin-bottom: 24px;
    cursor: pointer;
  }
  .starIcon.filled { color: #f5a623; }
  .starIcon { color: #555; transition: color 0.1s; }
  #ratingConfirmBtn {
    width: 100%;
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    background: #f5a623;
    color: #1e1e1e;
  }
  #ratingConfirmBtn:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
  }

  /* 성장 비교 화면 */
  #growthScreen { display: none; }
  .growthHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .growthHeader .title {
    font-size: 20px;
    font-weight: 800;
    color: #f5a623;
  }
  #growthHomeBtn, #backToReadingBtn {
    background: #2b2b2b;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  #backToReadingBtn {
    width: 100%;
    margin-top: 8px;
    padding: 14px 0;
    font-size: 15px;
  }
  .growthBanner {
    display: none;
    text-align: center;
    background: linear-gradient(135deg, #f5a623, #ff6b6b);
    color: #1e1e1e;
    font-weight: 800;
    font-size: 18px;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    animation: popIn 0.4s ease;
  }
  .growthBanner.show { display: block; }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  .slotCard {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #111;
    border: 2px solid #333;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .slotEmoji {
    font-size: 34px;
    flex: none;
  }
  .slotInfo {
    flex: 1;
    min-width: 0;
  }
  .slotLabel {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
  }
  .slotMeta {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .slotStars {
    color: #f5a623;
    letter-spacing: 2px;
  }
  .slotPlayBtn {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #f5a623;
    color: #1e1e1e;
    border: none;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }
  .slotPlayBtn:disabled {
    background: #3a3a3a;
    color: #777;
    cursor: not-allowed;
  }
  .slotPlayBtn.playing {
    background: #e2735e;
    color: #fff;
  }
  .slotDownloadBtn {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #2b2b2b;
    color: #f5a623;
    border: 1px solid #f5a623;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  .slotDownloadBtn:disabled {
    background: #1a1a1a;
    color: #555;
    border-color: #444;
    cursor: not-allowed;
  }

  .teacherZone {
    margin-top: 20px;
    border-top: 1px solid #3a3a3a;
    padding-top: 16px;
  }
  #speedToggleBtn {
    width: 100%;
    margin-top: 10px;
    background: #2b2b2b;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 13px 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .speedAdjustRow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .speedAdjustBtn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #f5a623;
    color: #1e1e1e;
    border: none;
    font-size: 26px;
    font-weight: 800;
    cursor: pointer;
    flex: none;
  }
  .speedValueDisplay {
    min-width: 120px;
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }
  .lockPanel {
    display: none;
    margin-top: 10px;
    background: #111;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 14px;
  }
  .lockPanel.open { display: block; }
  .lockPanel label {
    display: block;
    font-size: 13px;
    color: #ccc;
    margin-bottom: 6px;
  }
  .lockRow {
    display: flex;
    gap: 8px;
  }
  input[type="password"] {
    flex: 1;
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
  }
  #pwSubmitBtn {
    flex: none;
    width: auto;
    padding: 10px 18px;
    background: #f5a623;
    color: #1e1e1e;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  .pwError {
    color: #ff6b6b;
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }
  .pwError.show { display: block; }
  .editPanel { display: none; margin-top: 10px; }
  .editPanel.open { display: block; }
  textarea {
    width: 100%;
    height: 120px;
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    resize: vertical;
    font-family: inherit;
  }
  #applyBtn {
    margin-top: 8px;
    background: #f5a623;
    color: #1e1e1e;
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #challengeScreen { display: none; }
</style>
</head>
<body>

<div class="card">

  <div id="mainScreen">
    <div class="mainTitle">리딩챌린지 도전</div>
    <div class="categoryRow">
      <div class="categoryBtn" id="catTraffic" data-category="traffic">
        <div class="icon">🚧</div>
        <div class="label">교통안전</div>
      </div>
      <div class="categoryBtn" id="catFriend" data-category="friendship">
        <div class="icon">🤝</div>
        <div class="label">친구관계</div>
      </div>
      <div class="categoryBtn" id="catSocial" data-category="social">
        <div class="icon">📰</div>
        <div class="label">시사상식</div>
      </div>
      <div class="categoryBtn" id="catTree" data-category="tree-menu">
        <div class="icon">🌳</div>
        <div class="label">나무</div>
      </div>
    </div>
  </div>

  <div id="treeMenuScreen">
    <div class="growthHeader">
      <div class="title">나무 - 어디부터 읽을까?</div>
      <button id="treeMenuHomeBtn">메인으로</button>
    </div>
    <div class="categoryBtn treeSubBtn" data-tree="tree-1-2">
      <div class="icon">🌱</div>
      <div class="label">1-2문단</div>
    </div>
    <div class="categoryBtn treeSubBtn" data-tree="tree-3-4">
      <div class="icon">🌿</div>
      <div class="label">3-4문단</div>
    </div>
    <div class="categoryBtn treeSubBtn" data-tree="tree-5-6">
      <div class="icon">🍃</div>
      <div class="label">5-6문단</div>
    </div>
    <div class="categoryBtn treeSubBtn" data-tree="tree-full">
      <div class="icon">🌳</div>
      <div class="label">전체</div>
    </div>
  </div>

  <div id="challengeScreen">
    <div class="header">
      <div class="sign">⚠</div>
      <div class="title" id="screenTitle">리딩 챌린지</div>
      <button id="homeBtn">메인으로</button>
    </div>

    <div class="stage">
      <div class="highlightBox"></div>
      <div class="track" id="track"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="durInfo" id="durInfo"></div>

    <div class="controls">
      <button class="ctl" id="playBtn">시작</button>
      <button class="ctl" id="restartBtn">처음부터</button>
    </div>

    <div class="speedRow" id="speedRow">
      <button class="speedBtn" data-rate="4">더 천천히<br>(4음절/초)</button>
      <button class="speedBtn active" data-rate="6">기본 속도<br>(6음절/초)</button>
      <button class="speedBtn" data-rate="8">더 빠르게<br>(8음절/초 · 아나운서 속도)</button>
    </div>

    <div class="caption">화면을 따라 문장을 소리 내어 읽어 보세요</div>

    <div class="recordZone">
      <button id="recordBtn">🎤 녹음하기</button>
      <button id="growthCheckBtn">📈 성장과정 확인하기</button>
      <div class="recordStatus" id="recordStatus"></div>
    </div>

    <div class="modalOverlay" id="ratingOverlay">
      <div class="modalBox">
        <div class="modalQuestion">오늘 내 목소리는 몇 점?</div>
        <div class="starRow" id="starRow">
          <span class="starIcon" data-star="1">☆</span><span class="starIcon" data-star="2">☆</span><span class="starIcon" data-star="3">☆</span><span class="starIcon" data-star="4">☆</span><span class="starIcon" data-star="5">☆</span>
        </div>
        <button id="ratingConfirmBtn" disabled>완료!</button>
      </div>
    </div>

    <div class="teacherZone">
      <button id="speedToggleBtn">속도 조절하기 (선생님용)</button>

      <div class="lockPanel" id="lockPanel">
        <label>비밀번호를 입력하세요</label>
        <div class="lockRow">
          <input type="password" id="pwInput" placeholder="비밀번호">
          <button id="pwSubmitBtn">확인</button>
        </div>
        <div class="pwError" id="pwError">비밀번호가 틀렸습니다.</div>
      </div>

      <div class="editPanel" id="speedEditPanel">
        <label style="display:block; font-size:13px; color:#ccc; margin-bottom:6px;">현재 속도를 1음절/초 단위로 조절하세요</label>
        <div class="speedAdjustRow">
          <button id="speedMinusBtn" class="speedAdjustBtn">−</button>
          <div class="speedValueDisplay" id="speedValueDisplay">6 음절/초</div>
          <button id="speedPlusBtn" class="speedAdjustBtn">＋</button>
        </div>
      </div>
    </div>
  </div>

  <div id="growthScreen">
    <div class="growthHeader">
      <div class="title" id="growthTitle">녹음 & 성장 비교</div>
      <button id="growthHomeBtn">메인으로</button>
    </div>

    <div class="growthBanner" id="growthBanner">🎉 유창성 폭풍 성장! 🎉</div>

    <div class="slotCard">
      <div class="slotEmoji">🐥</div>
      <button class="slotPlayBtn" id="playBefore" disabled>▶</button>
      <div class="slotInfo">
        <div class="slotLabel">처음 읽은 목소리</div>
        <div class="slotMeta" id="metaBefore">아직 녹음이 없어요</div>
      </div>
      <button class="slotDownloadBtn" id="downloadBefore" disabled>⬇</button>
      <audio id="audioBefore"></audio>
    </div>

    <div class="slotCard">
      <div class="slotEmoji">🦁</div>
      <button class="slotPlayBtn" id="playRecent" disabled>▶</button>
      <div class="slotInfo">
        <div class="slotLabel">방금 읽은 목소리</div>
        <div class="slotMeta" id="metaRecent">아직 녹음이 없어요</div>
      </div>
      <button class="slotDownloadBtn" id="downloadRecent" disabled>⬇</button>
      <audio id="audioRecent"></audio>
    </div>

    <button id="backToReadingBtn">다시 연습하기</button>
  </div>

</div>

<script>
const PASSWORD = "0901";

const CATEGORY_LABELS = {
  traffic: "교통안전",
  friendship: "친구관계",
  social: "시사상식",
  "tree-1-2": "나무 (1-2문단)",
  "tree-3-4": "나무 (3-4문단)",
  "tree-5-6": "나무 (5-6문단)",
  "tree-full": "나무 (전체)"

function splitAuto(text) {
  // 마침표/물음표/느낌표/쉼표 뒤를 절(clause) 경계로 보고,
  // 그 경계에서만 합치거나 나눈다 (절 중간에서 자르지 않음).
  // 오프닝 인사말(맨 앞 두 절)과 클로징 멘트(맨 뒤 두 절)는
  // 7단어 미만이어도 예외로 두고 각각 한 줄로 유지한다.
  // 그 사이 본문은 최소 MIN_WORDS(7)개의 어절을 갖도록 이어 붙인다.
  const MIN_WORDS = 7;
  const clean = text.replace(/∨+/g, " ").replace(/\n+/g, " ").replace(/\s+/g, " ").trim();
  const units = clean.split(/(?<=[.!?,])\s+/).map(s => s.trim()).filter(Boolean);

  if (units.length === 0) return [];
  if (units.length < 4) {
    return [units.join(" ").trim()];
  }

  const openingLine = units.slice(0, 2).join(" ").trim();
  const closingLine = units.slice(-2).join(" ").trim();
  const middleUnits = units.slice(2, units.length - 2);

  const lines = [openingLine];
  let cur = "";

  middleUnits.forEach(u => {
    cur = cur ? cur + " " + u : u;
    const wordCount = cur.split(/\s+/).filter(Boolean).length;
    if (wordCount >= MIN_WORDS) {
      lines.push(cur.trim());
      cur = "";
    }
  });

  if (cur.trim().length > 0) {
    // 본문 중간에 7단어 미만으로 남은 조각은 바로 앞 본문 줄에 합친다
    // (오프닝 줄에는 합치지 않는다)
    if (lines.length > 1) {
      lines[lines.length - 1] = lines[lines.length - 1] + " " + cur.trim();
    } else {
      lines.push(cur.trim());
    }
  }

  lines.push(closingLine);
  return lines;
}

function splitByMarks(text) {
  // "/"(짧은 끊어읽기)와 "//"(문장 경계)로 미리 표시된 대본은
  // 이미 사람이 정확히 끊어읽기 위치를 정해둔 것이므로,
  // 단어 수 기준으로 다시 합치지 않고 표시된 위치 그대로 줄을 나눈다.
  const clean = text.replace(/\n+/g, " ").trim();
  return clean.split(/\/\/|\//).map(s => s.trim()).filter(Boolean);
}

function splitIntoLines(text) {
  if (text.indexOf("/") !== -1) {
    return splitByMarks(text);
  }
  return splitAuto(text);
}

const PX_PER_CHAR = 3;
const MIN_HEIGHT = 55;
const GAP_HEIGHT = 17;

let lines = [];
let renderItems = [];
let heights = [];
let cumHeights = [0];
let totalHeight = 0;
let rate = 6;
let playing = false;
let rafId = null;
let startTs = null;
let pausedElapsed = 0;
let totalDuration = 0;

const track = document.getElementById("track");
const progressBar = document.getElementById("progressBar");
const playBtn = document.getElementById("playBtn");
const restartBtn = document.getElementById("restartBtn");
const speedRow = document.getElementById("speedRow");
const durInfo = document.getElementById("durInfo");
const screenTitle = document.getElementById("screenTitle");
const mainScreen = document.getElementById("mainScreen");
const challengeScreen = document.getElementById("challengeScreen");
const STAGE_HEIGHT = 340;

function speedConst() {
  return PX_PER_CHAR * rate;
}

function computeGeometry() {
  // 실제로 화면에 렌더링된 높이를 그대로 잰다. 긴 문장이 여러 줄로
  // 감싸지는 경우에도(워드랩) 실제 줄 수만큼 정확한 높이가 나오므로,
  // 문장 사이 간격이 항상 정확히 GAP_HEIGHT(px)로 유지된다.
  const children = track.children;
  heights = renderItems.map((item, i) => {
    if (item.isGap) return GAP_HEIGHT;
    return children[i].getBoundingClientRect().height;
  });
  cumHeights = [0];
  for (let i = 0; i < heights.length; i++) {
    cumHeights.push(cumHeights[i] + heights[i]);
  }
  totalHeight = cumHeights[cumHeights.length - 1];
  totalDuration = totalHeight / speedConst();

  const mins = Math.floor(totalDuration / 60);
  const secs = Math.round(totalDuration % 60);
  durInfo.textContent = "예상 재생 시간: 약 " + (mins > 0 ? mins + "분 " : "") + secs + "초 (" + rate + "음절/초, 처음부터 끝까지 일정 속도)";
}

function buildFromScript(text) {
  currentScriptText = text;
  lines = splitIntoLines(text);
  if (lines.length === 0) lines = ["대본을 입력해 주세요."];

  renderItems = [];
  lines.forEach((l, i) => {
    renderItems.push({ text: l, isGap: false });
    if (i < lines.length - 1) renderItems.push({ text: "", isGap: true });
  });

  track.innerHTML = "";
  renderItems.forEach(item => {
    const div = document.createElement("div");
    div.className = "line" + (item.isGap ? " gap" : "");
    div.textContent = item.text;
    div.style.height = item.isGap ? (GAP_HEIGHT + "px") : "auto";
    track.appendChild(div);
  });

  computeGeometry();
  resetPlayback();
}

function resetPlayback() {
  pause();
  pausedElapsed = 0;
  progressBar.style.width = "0%";
  playBtn.textContent = "시작";
  updateTrackPosition(0);
}

function findSegment(distance) {
  for (let i = 0; i < heights.length; i++) {
    if (distance >= cumHeights[i] && distance < cumHeights[i + 1]) return i;
  }
  return heights.length - 1;
}

function updateTrackPosition(elapsedSec) {
  const distance = Math.min(elapsedSec * speedConst(), totalHeight);
  const seg = findSegment(distance);

  const y = -(distance) + STAGE_HEIGHT / 2;
  track.style.transform = "translateY(" + y + "px)";

  const children = track.children;
  for (let i = 0; i < children.length; i++) {
    if (i === seg) {
      children[i].classList.add("active");
    } else {
      children[i].classList.remove("active");
    }
  }

  progressBar.style.width = (totalHeight > 0 ? (distance / totalHeight * 100) : 0).toFixed(1) + "%";
}

function frame(ts) {
  if (startTs === null) startTs = ts;
  const elapsedSec = pausedElapsed + ((ts - startTs) / 1000);
  updateTrackPosition(elapsedSec);

  if (elapsedSec >= totalDuration) {
    playing = false;
    playBtn.textContent = "다시 재생";
    pausedElapsed = totalDuration;
    return;
  }
  rafId = requestAnimationFrame(frame);
}

function play() {
  if (pausedElapsed >= totalDuration) pausedElapsed = 0;
  playing = true;
  playBtn.textContent = "일시정지";
  startTs = null;
  rafId = requestAnimationFrame(frame);
}

function pause() {
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  playBtn.textContent = "계속하기";
}

playBtn.addEventListener("click", () => {
  if (playing) {
    const ts = performance.now();
    if (startTs !== null) pausedElapsed += ((ts - startTs) / 1000);
    pause();
  } else {
    play();
  }
});

restartBtn.addEventListener("click", () => {
  resetPlayback();
});

speedRow.addEventListener("click", (e) => {
  const btn = e.target.closest(".speedBtn");
  if (!btn) return;
  const wasPlaying = playing;
  document.querySelectorAll(".speedBtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  rate = parseFloat(btn.dataset.rate);
  computeGeometry();
  resetPlayback();
  if (wasPlaying) play();
});

function clearPreviousRecording() {
  if (currentAudioUrl && !urlStillInUse(currentCategory, currentAudioUrl)) {
    URL.revokeObjectURL(currentAudioUrl);
  }
  currentAudioUrl = null;
}

async function startRecording() {
  if (!window.isSecureContext) {
    recordStatus.textContent = "이 페이지가 안전한 주소(https)로 열려 있지 않아서 마이크를 쓸 수 없어요. 파일을 그냥 열지 말고, 인터넷 주소(https://...)로 접속해 주세요.";
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    recordStatus.textContent = "이 브라우저/기기에서는 녹음 기능을 지원하지 않아요.";
    return;
  }
  try {
    recordStatus.textContent = "마이크 권한을 확인하고 있어요...";
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // 새 녹음을 시작하는 즉시 이전 녹음본은 삭제한다
    clearPreviousRecording();
    audioChunks = [];

    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm"))
      ? "audio/webm"
      : ((window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/mp4")) ? "audio/mp4" : "");
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      currentAudioMimeType = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type: currentAudioMimeType });
      currentAudioUrl = URL.createObjectURL(blob);
      recordStatus.textContent = "";

      // 녹음본을 바로 들려주지 않고, 별점만 먼저 물어본다
      pendingRating = 0;
      ratingOverlay.classList.add("show");
    };
    mediaRecorder.onerror = (e) => {
      console.error("MediaRecorder error:", e.error || e);
      recordStatus.textContent = "녹음 중 오류가 발생했어요: " + ((e.error && e.error.message) || "알 수 없는 오류");
    };

    recordStartTime = Date.now();
    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = "⏹ 녹음중지";
    recordBtn.classList.add("recording");
    recordStatus.textContent = "🎙️ 녹음 중이에요...";
  } catch (err) {
    console.error("getUserMedia failed:", err);
    let msg = "마이크를 시작하지 못했어요.";
    if (err && err.name === "NotAllowedError") {
      msg = "마이크 권한이 거부됐어요. 브라우저 주소창 왼쪽의 자물쇠 아이콘(또는 기기 설정)에서 마이크 권한을 '허용'으로 바꾼 뒤 새로고침해 주세요.";
    } else if (err && err.name === "NotFoundError") {
      msg = "이 기기에서 마이크 장치를 찾을 수 없어요.";
    } else if (err && err.name) {
      msg = "마이크를 시작하지 못했어요 (" + err.name + "). 개발자도구 콘솔에서 자세한 내용을 확인할 수 있어요.";
    }
    recordStatus.textContent = msg;
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    isRecording = false;
    recordBtn.textContent = "🎤 녹음하기";
    recordBtn.classList.remove("recording");
    recordStatus.textContent = "녹음을 정리하고 있어요...";
    mediaRecorder.stop();
  }
}

recordBtn.addEventListener("click", () => {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

starRow.querySelectorAll(".starIcon").forEach(star => {
  star.addEventListener("click", () => {
    pendingRating = parseInt(star.dataset.star, 10);
    starRow.querySelectorAll(".starIcon").forEach(s => {
      const val = parseInt(s.dataset.star, 10);
      s.textContent = val <= pendingRating ? "★" : "☆";
      s.classList.toggle("filled", val <= pendingRating);
    });
    ratingConfirmBtn.disabled = false;
  });
});

ratingConfirmBtn.addEventListener("click", () => {
  ratingOverlay.classList.remove("show");
  starRow.querySelectorAll(".starIcon").forEach(s => {
    s.textContent = "☆";
    s.classList.remove("filled");
  });
  ratingConfirmBtn.disabled = true;

  const elapsedSec = (Date.now() - recordStartTime) / 1000;
  finalizeRecording(currentCategory, {
    url: currentAudioUrl,
    rating: pendingRating,
    elapsedSec,
    mimeType: currentAudioMimeType
  });

  // 별점 입력이 끝나면 다시 프롬프트 화면으로 - 스크롤은 정지 상태로 처음으로
  resetPlayback();
});

// 두 슬롯 중 아직 이 url을 참조하는 슬롯이 남아있는지 확인 후에만 안전하게 해제한다
function urlStillInUse(cat, url) {
  const s = audioSlots[cat];
  return [s.before, s.recent].some(e => e && e.url === url);
}
function safeRevoke(cat, url) {
  if (url && !urlStillInUse(cat, url)) {
    URL.revokeObjectURL(url);
  }
}

function finalizeRecording(cat, rec) {
  const entry = {
    url: rec.url,
    rating: rec.rating,
    elapsedSec: rec.elapsedSec,
    mimeType: rec.mimeType || "audio/webm"
  };

  const slots = audioSlots[cat];
  const oldRecentUrl = slots.recent ? slots.recent.url : null;

  // 1. [처음 읽기] - 이 반/주제에서 첫 완료 녹음이면 고정, 이후 절대 덮어쓰지 않음
  if (!slots.before) {
    slots.before = entry;
  }

  // 2. [최근 읽기] - 항상 최신 녹음으로 덮어쓴다
  slots.recent = entry;

  // 더 이상 어떤 슬롯도 참조하지 않는 예전 오디오만 정리한다
  safeRevoke(cat, oldRecentUrl);
}

// 카드에 붙은 오디오 2개 중 하나만 항상 재생되도록 강제한다 (저사양 기기 리소스 보호)
const slotAudios = {
  before: document.getElementById("audioBefore"),
  recent: document.getElementById("audioRecent")
};
const slotPlayBtns = {
  before: document.getElementById("playBefore"),
  recent: document.getElementById("playRecent")
};
const slotDownloadBtns = {
  before: document.getElementById("downloadBefore"),
  recent: document.getElementById("downloadRecent")
};

function extensionForMimeType(mimeType) {
  if (!mimeType) return "webm";
  if (mimeType.indexOf("mp4") !== -1) return "m4a";
  if (mimeType.indexOf("ogg") !== -1) return "ogg";
  return "webm";
}

Object.keys(slotDownloadBtns).forEach(key => {
  slotDownloadBtns[key].addEventListener("click", () => {
    const entry = audioSlots[currentCategory] && audioSlots[currentCategory][key];
    if (!entry) return;
    const slotLabel = key === "before" ? "처음읽기" : "최근읽기";
    const ext = extensionForMimeType(entry.mimeType);
    const fileName = CATEGORY_LABELS[currentCategory] + "_" + slotLabel + "." + ext;

    const a = document.createElement("a");
    a.href = entry.url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
});

function stopAllSlotAudio(exceptKey) {
  Object.keys(slotAudios).forEach(key => {
    if (key !== exceptKey) {
      slotAudios[key].pause();
      slotAudios[key].currentTime = 0;
      slotPlayBtns[key].textContent = "▶";
      slotPlayBtns[key].classList.remove("playing");
    }
  });
}

Object.keys(slotAudios).forEach(key => {
  const audioEl = slotAudios[key];
  const btn = slotPlayBtns[key];
  audioEl.addEventListener("ended", () => {
    btn.textContent = "▶";
    btn.classList.remove("playing");
  });
  btn.addEventListener("click", () => {
    if (btn.disabled) return;
    if (!audioEl.paused) {
      audioEl.pause();
      btn.textContent = "▶";
      btn.classList.remove("playing");
      return;
    }
    stopAllSlotAudio(key);
    audioEl.play();
    btn.textContent = "⏸";
    btn.classList.add("playing");
  });
});

function formatSlotMeta(entry) {
  if (!entry) return "아직 녹음이 없어요";
  const stars = "★".repeat(entry.rating) + "☆".repeat(5 - entry.rating);
  return `<span class="slotStars">${stars}</span> · ${Math.round(entry.elapsedSec)}초`;
}

function showGrowthScreen(cat) {
  const slots = audioSlots[cat];
  growthTitle.textContent = "녹음 & 성장 비교 · " + CATEGORY_LABELS[cat];

  const metaEls = {
    before: document.getElementById("metaBefore"),
    recent: document.getElementById("metaRecent")
  };

  ["before", "recent"].forEach(key => {
    const entry = slots[key];
    metaEls[key].innerHTML = formatSlotMeta(entry);
    slotAudios[key].src = entry ? entry.url : "";
    slotPlayBtns[key].disabled = !entry;
    slotPlayBtns[key].textContent = "▶";
    slotPlayBtns[key].classList.remove("playing");
    slotDownloadBtns[key].disabled = !entry;
  });

  // 처음(before) 대비 최근(recent) 소요 시간 비교
  if (slots.before && slots.recent && slots.recent !== slots.before) {
    const improvedSec = slots.before.elapsedSec - slots.recent.elapsedSec;
    if (improvedSec >= 3) {
      growthBanner.innerHTML = `🎉 유창성 폭풍 성장! 처음보다 <b>${improvedSec.toFixed(1)}초</b> 더 빨라졌어요! 🎉`;
      growthBanner.classList.add("show");
    } else if (improvedSec > 0) {
      growthBanner.innerHTML = `👍 처음보다 <b>${improvedSec.toFixed(1)}초</b> 빨라졌어요!`;
      growthBanner.classList.add("show");
    } else {
      growthBanner.classList.remove("show");
    }
  } else {
    growthBanner.classList.remove("show");
  }

  challengeScreen.style.display = "none";
  mainScreen.style.display = "none";
  growthScreen.style.display = "block";
}

growthCheckBtn.addEventListener("click", () => {
  if (isRecording) stopRecording();
  showGrowthScreen(currentCategory);
});

growthHomeBtn.addEventListener("click", () => {
  stopAllSlotAudio(null);
  growthScreen.style.display = "none";
  if (currentCategory && currentCategory.indexOf("tree-") === 0) {
    treeMenuScreen.style.display = "block";
  } else {
    mainScreen.style.display = "block";
  }
});

backToReadingBtn.addEventListener("click", () => {
  stopAllSlotAudio(null);
  growthScreen.style.display = "none";
  challengeScreen.style.display = "block";
});

function openCategory(cat) {
  currentCategory = cat;
  screenTitle.textContent = "리딩 챌린지 · " + CATEGORY_LABELS[cat];
  mainScreen.style.display = "none";
  treeMenuScreen.style.display = "none";
  challengeScreen.style.display = "block";
  speedEditPanel.classList.remove("open");
  lockPanel.classList.remove("open");
  clearPreviousRecording();
  buildFromScript(scriptsState[cat]);
}

function goHome() {
  pause();
  if (isRecording) stopRecording();
  challengeScreen.style.display = "none";
  if (currentCategory && currentCategory.indexOf("tree-") === 0) {
    treeMenuScreen.style.display = "block";
  } else {
    mainScreen.style.display = "block";
  }
}

document.querySelectorAll("#mainScreen .categoryBtn").forEach(btn => {
  if (btn.dataset.category === "tree-menu") {
    btn.addEventListener("click", () => {
      mainScreen.style.display = "none";
      treeMenuScreen.style.display = "block";
    });
  } else {
    btn.addEventListener("click", () => openCategory(btn.dataset.category));
  }
});

document.querySelectorAll(".treeSubBtn").forEach(btn => {
  btn.addEventListener("click", () => openCategory(btn.dataset.tree));
});

const treeMenuScreen = document.getElementById("treeMenuScreen");
document.getElementById("treeMenuHomeBtn").addEventListener("click", () => {
  treeMenuScreen.style.display = "none";
  mainScreen.style.display = "block";
});

document.getElementById("homeBtn").addEventListener("click", goHome);

</script>

</body>
</html>
